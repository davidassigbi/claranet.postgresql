---
# # Variable configuration.

- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ loop_vars }}"
  loop: "{{ query('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distro }}-{{ ansible_distro_version }}.yaml"
        - "{{ ansible_distro }}-{{ ansible_distro_release }}.yaml"
        - "{{ ansible_distro }}-{{ ansible_distro_major_version }}.yaml"
        - "{{ ansible_distro }}.yaml"
        - "{{ ansible_os_family | lower }}-{{ ansible_distro_major_version }}-family.yaml"
        - "{{ ansible_os_family | lower }}-family.yaml"
        - "{{ ansible_system | lower }}.yaml"
      paths:
        - "vars"
      skip: true
  loop_control:
    loop_var: loop_vars
  # tags: always

