---
- name: Verify cluster setup
  hosts: all
  tags: always
  vars:
    postgresql_version: 14

  tasks:
    - name: Check if postgresql is installed or not
      block:
        - name: "Retrieve package facts"
          ansible.builtin.package_facts:
            manager: auto

        # - name: show ansible_facts.packages
        #   ansible.builtin.debug:
        #     vars: ansible_facts.packages

        # - ansible.builtin.meta: end_play

        - name: Ensure postgresql server packages are installed
          ansible.builtin.assert:
            that:
              - '"postgresql-{{ postgresql_version }}" in ansible_facts.packages or "postgresql{{ postgresql_version }}-server" in ansible_facts.packages'

    - name: Get service status on redhat like systems
      ansible.builtin.systemd:
        name: postgresql-{{ postgresql_version }}
      register: postgresql_service_redhat
      when: ansible_os_family | lower == "redhat"

    - name: Get service status on debian like systems
      ansible.builtin.systemd:
        name: postgresql@{{ postgresql_version }}-main
      register: postgresql_service_debian
      when: ansible_os_family | lower == "debian"

    - name: Set postgresql_service
      ansible.builtin.set_fact:
        postgresql_service: "{{ postgresql_service_redhat is skipped | ternary(postgresql_service_debian, postgresql_service_redhat) }}"

    - name: Check that mariadb service is active and enabled
      ansible.builtin.assert:
        that:
          - postgresql_service.status.ActiveState == 'active'
          - postgresql_service.status.UnitFileState in ['enabled', 'enabled-runtime']

    - name: Check if port 5432 is listening
      ansible.builtin.wait_for:
        port: 5432
        delay: 5
        timeout: 10
        msg: "Timeout waiting for 5432 to respond"
      register: port_check
      ignore_errors: true


- name: Verify replication
  hosts: replica
  tags: always
  become: true
#   vars:
#     postgresql_version: 14

  tasks:
    - name: Retrieve databases on replica nodes
      ansible.builtin.command: psql -q -A -t -c "SELECT datname FROM pg_database"
      register: databases
      changed_when: false
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Assert db created on primary is also present on the replicas
      ansible.builtin.assert:
        that: item in databases.stdout_lines
      loop: [db1]

#     - name: Retrieve replication status

#     - name: Assert that replication is working

    - name: Remove test database from primary
      ansible.builtin.command: dropdb db2
      run_once: true
      failed_when: false
      changed_when: true
      delegate_to: "{{ postgresql_replication_primary_inventory_name }}"
      tags: skip_ansible_lint
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Retrieve databases on replica nodes
      ansible.builtin.command: psql -q -A -t -c "SELECT datname FROM pg_database"
      register: databases
      changed_when: false
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Assert db created on primary is also present on the replicas
      ansible.builtin.assert:
        that: '"db2" not in databases.stdout_lines'

    - name: Recreate test database on primary
      ansible.builtin.command: createdb -O user2 db2
      run_once: true
      changed_when: false
      delegate_to: "{{ postgresql_replication_primary_inventory_name }}"
      become_user: postgres
      tags: skip_ansible_lint
      vars:
        ansible_ssh_pipelining: true
