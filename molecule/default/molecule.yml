---
dependency:
  name: shell
  command: python3 -m pip install pytest-testinfra

driver:
  name: docker

platforms:
  # On "${name:-${image:-debian}", the last brace does not miss, it works like that...
  # The env var should be used when the image variable refers to a full registry path like registry.access.redhat.com/ubi8/ubi
  - &default
    # name: debian11
    # image: debian:11
    name: claranet_postgresql_${name:-${image:-debian}-${tag:-latest}-${scenario:-default}${postgresql_version}
    # name: rocky8 
    # image: rockylinux:8.7
    # name: claranet_postgresql_${name:-${image:-debian}-${tag:-latest}-${scenario:-default}
    image: ${image:-debian}:${tag:-latest}
    privileged: true
    tty: true
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    stop_signal: "SIGRTMIN+3"
    capabilities:
      - SYS_ADMIN
      - SYS_TIME
      - LINUX_IMMUTABLE
    command: "/lib/systemd/systemd"
    cgroupns_mode: host

  # - <<: *default
  #   name: debian11
  #   image: debian:11

  # - <<: *default
  #   name: debian12
  #   image: debian:12

  # - <<: *default
  #   name: ubuntu18
  #   image: ubuntu:18.04

  # - <<: *default
  #   name: ubuntu20
  #   image: ubuntu:20.04

  # - <<: *default
  #   name: ubuntu22
  #   image: ubuntu:22.04

  # - <<: *default # EOL reached https://www.centos.org/centos-linux-eol/
  #   name: centos8
  #   image: quay.io/centos/centos:centos8
  #   # dockerfile: Dockerfile.centos8.j2

  # - <<: *default
  #   name: centosStream8
  #   image: quay.io/centos/centos:stream8

  # - <<: *default
  #   name: ol7
  #   image: oraclelinux:7

  # - <<: *default
  #   name: rocky8
  #   image: rockylinux:8.7

  # - <<: *default
  #   name: rocky9
  #   image: rockylinux:9.1

  # - <<: *default
  #   name: amazonlinux2
  #   image: amazonlinux:2.0.20230307.0

  # - <<: *default
  #   name: fedora36
  #   image: fedora:36

  # - <<: *default
  #   name: fedora37
  #   image: fedora:37

  # - <<: *default
  #   name: fedora38
  #   image: fedora:38

provisioner:
  name: ansible
  env:
    ANSIBLE_FORCE_COLOR: "true"
  options:
    v: true
  ansible_args:
    - -v
    # - --tags=always,uninstall
    # - --tags=always,owner
    # - --tags=always,install,init,autotune,config,users,tbspc,db,owner
    # - --tags=always,install,init,autotune,config,users,tbspc,db,owner,ext,query,backup,uninstall
    - --tags=always,uninstall,install,init,autotune,config,repli,backup,user,tablespace,db,owner,ext,query
    # autotune
  inventory:
    group_vars:
      all:
        postgresql_debug: true
        # postgresql_uninstall_1: true
        # postgresql_uninstall_2: true
    host_vars:
      claranet_postgresql_debian-10-${scenario:-default}:
        postgresql_version: 13
      claranet_postgresql_debian-11-${scenario:-default}:
        postgresql_version: 14
      claranet_postgresql_ubuntu-18.04-${scenario:-default}:
        postgresql_version: 15
      claranet_postgresql_ubuntu-20.04-${scenario:-default}:
        postgresql_version: 15
      claranet_postgresql_ubuntu-22.04-${scenario:-default}:
        postgresql_version: 15
      claranet_postgresql_centos-8-${scenario:-default}:
        postgresql_version: 13
      claranet_postgresql_stream-8.7-${scenario:-default}:
        postgresql_version: 13
      claranet_postgresql_rocky-8-${scenario:-default}:
        postgresql_version: 13
      claranet_postgresql_rocky-9-${scenario:-default}:
        postgresql_version: 13
      claranet_postgresql_fedora-36-${scenario:-default}:
        postgresql_version: 13
      claranet_postgresql_fedora-37-${scenario:-default}:
        postgresql_version: 13

verifier:
  name: testinfra
  options:
    verbose: true
    s: true

lint: |
  set -e
  yamllint .
  ansible-lint
