---
__postgresql_version: "14"
__postgresql_data_dir: "/var/lib/pgsql/data"
__postgresql_bin_path: "/usr/pgsql-{{ postgresql_version }}/bin"
__postgresql_config_path: "/var/lib/pgsql/data"
_postgresql_daemon: "{{ postgresql_daemon | d('postgresql-' ~ postgresql_version, true) }}"
__postgresql_packages:
  # needed for installing psycopg2
  - python3-pip
  - python3-devel
  - cronie # dependency for managing crontab files on redhat
  # - libpq-devel
  - postgresql{{ postgresql_version }}-server
  - postgresql{{ postgresql_version }}-contrib
  - postgresql{{ postgresql_version }}-devel
  - nano
  # - pg_activity # errors where occuring while installing this package on rocky linux 9 so we switched to the python package

__postgresql_unix_socket_directories_mode: '0755'
__postgresql_mirror_url: https://download.postgresql.org/pub/repos/yum/reporpms
_postgresql_repo_rpm_url: "{{ postgresql_mirror_url }}/{{ (ansible_distro == 'fedora') | ternary('F', 'EL') }}-{{ ansible_distribution_major_version }}-x86_64/pgdg-{{ (ansible_distro == 'fedora') | ternary('fedora', 'redhat') }}-repo-latest.noarch.rpm"

__postgresql_service_path: /usr/lib/systemd/system/postgresql-{{ postgresql_version }}.service
# postgresql_python_library: python3-psycopg2
_postgresql_dependencies_pip_packages:
  - psycopg2 # most modules of the community.postgresql collection
  - ipaddress # needed by the postgresql_pg_hba module
  - pg_activity[psycopg] 
