#     # backup_file: "{{ postgresql_config_path }}/pg_hba.conf.backup"
#     # backup: true
#   loop: "{{ postgresql_hba_entries + _postgresql_replication_hba_entries }}"
#   notify: Restart postgresql

- name: Configure host based authentication (if entries are configured).
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgresql_config_path }}/pg_hba.conf"
    backup_file: "{{ postgresql_config_path }}/pg_hba.conf.backup"
    backup: true
    # overwrite: true
    rules: "{{ postgresql_hba_entries + _postgresql_replication_hba_entries }}"
  notify: Restart postgresql

- name: Ensure PostgreSQL unix socket dirs exist.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ postgresql_user }}"
    group: "{{ postgresql_group }}"
    mode: "{{ postgresql_unix_socket_directories_mode }}"
  loop: "{{ postgresql_unix_socket_directories }}"

- name: Ensure postgresql service is running with latest up to date configuration
  ansible.builtin.meta: flush_handlers
