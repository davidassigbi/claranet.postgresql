---
- name: Add postgresql repository
  ansible.builtin.template:
    src: etc/apt/sources.list.d/pgdb.list.j2
    dest: /etc/apt/sources.list.d/pgdg.list
    owner: root
    group: root
    mode: "644"

- name: Add postgreqsl repository signing key
  ansible.builtin.uri:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/trusted.gpg.d/pgdb.asc
    owner: root
    group: root
    mode: "644"
    status_code: [200, 304]
  environment: "{{ _postgresql_general_proxy_env }}"

- name: Ensure PostgreSQL packages are installed.
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present
    update_cache: true
  environment: "{{ _postgresql_pkg_proxy_env }}"

- name: Ensure all configured locales are present.
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ postgresql_locales }}"
  register: _postgresql_locale_gen_result
