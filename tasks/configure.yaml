---
- name: Update PGDATA env var in the service file on redhat
  community.general.ini_file:
    path: '{{ postgresql_service_path }}'
    section: Service
    option: Environment
    value: PGDATA={{ postgresql_data_dir }}
    state: present
  notify:
    - Reload systemd
    - Restart postgresql
  when:
    - postgresql_service_path | length > 0
    - ansible_os_family | lower == 'redhat'

- name: Configure global settings.
  ansible.builtin.lineinfile:
    dest: "{{ postgresql_config_path }}/postgresql.conf"
    regexp: "^#?{{ item.option }}.+$"
    line: "{{ item.option }} = '{{ item.value }}'"
    state: "{{ item.state | default('present') }}"
    mode: 0644
  loop: "{{ postgresql_global_config_options }}"
  notify: Restart postgresql

- name: Configure host based authentication (if entries are configured).
  ansible.builtin.template:
    src: "pg_hba.conf.j2"
    dest: "{{ postgresql_config_path }}/pg_hba.conf"
    owner: "{{ postgresql_user }}"
    group: "{{ postgresql_group }}"
    mode: 0600
  notify: Restart postgresql

- name: Ensure PostgreSQL unix socket dirs exist.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ postgresql_user }}"
    group: "{{ postgresql_group }}"
    mode: "{{ postgresql_unix_socket_directories_mode }}"
  loop: "{{ postgresql_unix_socket_directories }}"

- name: Ensure postgresql service is running with latest up to date configuration
  ansible.builtin.meta: flush_handlers
